<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>abyss-harness</title>
  </head>
  <body>
    <script>
      // Pre-paint theme resolution, mirroring ui-theme's applyResolved.
      // Runs before any stylesheet so the first frame is never a flash of
      // the wrong theme. Keep 'abyss-harness-theme' in sync with
      // packages/client/ui-theme/src/theme.ts (THEME_STORAGE_KEY).
      ;(() => {
        let mode = 'system'
        try {
          const saved = localStorage.getItem('abyss-harness-theme')
          if (saved === 'light' || saved === 'dark') mode = saved
        } catch {}
        const dark =
          mode === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
            : mode === 'dark'
        const root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
